# Continuous integration: on every push and pull request, run the API tests,
# build the frontend, and check that the Docker image builds.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-server:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test

  build-client:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [test-server, build-client]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t subtrack:ci .
